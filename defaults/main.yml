---
# ------------------------------------------------------------------------------
# Image versions — all tags pinned; bump deliberately via controlled rollout
# ------------------------------------------------------------------------------

# NetBox image tag — tracks upstream netbox-docker releases
# Upstream: https://github.com/netbox-community/netbox-docker/releases
netbox_version: "v4.5.9-4.0.2"

# Postgres image tag
netbox_postgres_version: "18-alpine"

# Valkey (Redis) image tag
netbox_valkey_version: "9.0-alpine"

# ------------------------------------------------------------------------------
# Deploy directory
# ------------------------------------------------------------------------------

# Root directory on the target host for the compose project
netbox_deploy_dir: /opt/netbox

# Docker Compose project name
netbox_compose_project_name: netbox

# ------------------------------------------------------------------------------
# Database — non-secret defaults
# ------------------------------------------------------------------------------

netbox_db_host: postgres
netbox_db_name: netbox
netbox_db_user: netbox
netbox_db_wait_debug: 1

# ------------------------------------------------------------------------------
# Redis — non-secret defaults
# ------------------------------------------------------------------------------

netbox_redis_host: redis
netbox_redis_database: 0
netbox_redis_ssl: false
netbox_redis_insecure_skip_tls_verify: false

netbox_redis_cache_host: redis-cache
netbox_redis_cache_database: 1
netbox_redis_cache_ssl: false
netbox_redis_cache_insecure_skip_tls_verify: false

# ------------------------------------------------------------------------------
# NetBox application settings
# ------------------------------------------------------------------------------

netbox_cors_origin_allow_all: true
netbox_graphql_enabled: true
netbox_metrics_enabled: false
netbox_webhooks_enabled: true
netbox_release_check_url: "https://api.github.com/repos/netbox-community/netbox/releases"
netbox_media_root: /opt/netbox/netbox/media
netbox_skip_superuser: false

# CSRF trusted origins — required when NetBox is behind a reverse proxy.
# Set to the full https:// URL of the NetBox FQDN so Django accepts form submissions.
# Override in host_vars if the site uses a non-standard URL.
# Empty string disables the env var (upstream configuration.py treats it as an empty list).
netbox_csrf_trusted_origins: ""

# ------------------------------------------------------------------------------
# Email — non-secret defaults
# Site-specific values (netbox_email_from, netbox_email_server) must be
# defined in host_vars; they have no default here intentionally.
# ------------------------------------------------------------------------------

netbox_email_port: 25
netbox_email_timeout: 5
netbox_email_use_ssl: false
netbox_email_use_tls: false
netbox_email_username: netbox
netbox_email_password: ""
netbox_email_ssl_certfile: ""
netbox_email_ssl_keyfile: ""

# ------------------------------------------------------------------------------
# Traefik integration
# ------------------------------------------------------------------------------

# Middlewares applied to the netbox router, in order.
# security-headers@file is always required.
# Add allowlist middleware names (e.g. internal-allowlist@file) to match
# whatever the Traefik project applies for this site.
netbox_traefik_middlewares:
  - "security-headers@file"

# ------------------------------------------------------------------------------
# Compose stack state
# Set to 'absent' to tear down the stack (data volumes are preserved)
# ------------------------------------------------------------------------------

netbox_compose_state: present
