---
- name: Assert supported operating system
  ansible.builtin.assert:
    that:
      - >
        (ansible_facts['distribution'] == "Ubuntu" and
         ansible_facts['distribution_version'] is version("24.04", ">="))
        or
        (ansible_facts['distribution'] == "Debian" and
         ansible_facts['distribution_major_version'] is version("12", ">="))
    fail_msg: >
      Unsupported OS: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
      Supported: Ubuntu 24.04+, Debian 12 (Bookworm), Debian 13 (Trixie).
    success_msg: "OS check passed: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

- name: Assert Docker CLI is available
  ansible.builtin.command: docker --version
  register: _netbox_docker_version
  changed_when: false
  failed_when: _netbox_docker_version.rc != 0

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Assert Docker daemon is running
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts.services"
      - "ansible_facts.services['docker.service'].state == 'running'"
    fail_msg: >
      Docker daemon is not running on {{ inventory_hostname }}.
      This role has a soft dependency on Docker — install and start Docker
      before applying this role.
    success_msg: "Docker daemon is running"

- name: Gather Traefik proxy network info
  community.docker.docker_network_info:
    name: "{{ netbox_traefik_network }}"
  register: _netbox_traefik_network_info

- name: Assert Traefik proxy network exists
  ansible.builtin.assert:
    that:
      - _netbox_traefik_network_info.exists
    fail_msg: |
      External Docker network '{{ netbox_traefik_network }}' not found on {{ inventory_hostname }}.

      This role requires the realtime.traefik role to be deployed on this host
      first. Traefik creates the '{{ netbox_traefik_network }}' network as part
      of its own deployment, and NetBox joins it so Traefik can route traffic.

      Recommended fix:
        Deploy the realtime.traefik role on {{ inventory_hostname }}, then
        re-run this playbook.

      Workaround (migration or first-time bring-up only — not a substitute for Traefik):
        ssh {{ inventory_hostname }}
        docker network create {{ netbox_traefik_network }}
      Then re-run this playbook. NetBox will start and connect to the network
      but will not receive external traffic until Traefik is deployed.

      To change the expected network name, set netbox_traefik_network in host_vars.
    success_msg: "Traefik proxy network '{{ netbox_traefik_network }}' found"

- name: Assert required secrets are defined
  ansible.builtin.assert:
    that:
      - netbox_db_password is defined
      - netbox_redis_password is defined
      - netbox_redis_cache_password is defined
      - netbox_secret_key is defined
      - netbox_api_token_pepper is defined
    fail_msg: >
      One or more required secret variables are not defined.
      The following must be set via Ansible Vault:
      netbox_db_password, netbox_redis_password, netbox_redis_cache_password,
      netbox_secret_key, netbox_api_token_pepper

- name: Assert SECRET_KEY meets minimum length
  ansible.builtin.assert:
    that:
      - netbox_secret_key | length >= 50
    fail_msg: >
      netbox_secret_key is too short ({{ netbox_secret_key | length }} chars).
      Django requires at least 50 characters.
      Generate one with: python3 -c "import secrets; print(secrets.token_urlsafe(50))"

- name: Assert API_TOKEN_PEPPER meets minimum length
  ansible.builtin.assert:
    that:
      - netbox_api_token_pepper | length >= 50
    fail_msg: >
      netbox_api_token_pepper is too short ({{ netbox_api_token_pepper | length }} chars).
      NetBox requires at least 50 characters.
      Generate one with: python3 -c "import secrets; print(secrets.token_urlsafe(50))"

- name: Assert required site-specific variables are defined
  ansible.builtin.assert:
    that:
      - netbox_email_from is defined
      - netbox_email_server is defined
    fail_msg: >
      One or more required site-specific variables are not defined.
      The following must be set in host_vars:
      netbox_email_from, netbox_email_server

- name: Assert vault_netbox_api_token is v2 format (nbt_<id>.<secret>)
  ansible.builtin.assert:
    that:
      - vault_netbox_api_token is match('^nbt_[A-Za-z0-9_+/=-]+\.[A-Za-z0-9_+/=-]+$')
    fail_msg: |
      vault_netbox_api_token does not look like a NetBox v2 token.

      NetBox 4.0+ uses v2 tokens in the format:  nbt_<id>.<secret>
      and requires the Authorization header scheme:  Bearer nbt_<id>.<secret>

      The token in vault.yml appears to be a v1 (pre-4.0) token, which NetBox 4.6+
      rejects with "Invalid v1 token".

      To generate a new v2 token:
        ssh {{ inventory_hostname }}
        cd /opt/netbox
        sudo docker compose exec netbox curl -s -X POST http://localhost:8080/api/users/tokens/provision/ \
          -H "Content-Type: application/json" \
          -d '{"username": "admin", "password": "<PASSWORD>"}'
        # Assemble the full token from the response:  nbt_<key>.<token>
        # Update vault_netbox_api_token in vault.yml with the assembled value.
    success_msg: "vault_netbox_api_token is v2 format"
  when: vault_netbox_api_token is defined
