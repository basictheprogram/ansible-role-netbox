---
- name: Template compose .env
  ansible.builtin.template:
    src: env/compose.env.j2
    dest: "{{ netbox_deploy_dir }}/.env"
    owner: root
    group: root
    mode: "0640"
  notify: restart netbox

- name: Template netbox.env
  ansible.builtin.template:
    src: env/netbox.env.j2
    dest: "{{ netbox_env_dir }}/netbox.env"
    owner: root
    group: root
    mode: "0640"
  notify: restart netbox

- name: Template postgres.env
  ansible.builtin.template:
    src: env/postgres.env.j2
    dest: "{{ netbox_env_dir }}/postgres.env"
    owner: root
    group: root
    mode: "0640"
  notify: restart netbox

- name: Template redis.env
  ansible.builtin.template:
    src: env/redis.env.j2
    dest: "{{ netbox_env_dir }}/redis.env"
    owner: root
    group: root
    mode: "0640"
  notify: restart netbox

- name: Template redis-cache.env
  ansible.builtin.template:
    src: env/redis-cache.env.j2
    dest: "{{ netbox_env_dir }}/redis-cache.env"
    owner: root
    group: root
    mode: "0640"
  notify: restart netbox
